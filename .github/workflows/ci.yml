name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Compile
        run: python -m compileall app_config.py env_store.py state_paths.py batch_state.py analysis_service.py web_gui.py transcription.py sheets_export.py llm_cloud_eval.py

      - name: Ruff
        run: ruff check app_config.py analysis_service.py batch_state.py env_store.py state_paths.py web_gui.py transcription.py sheets_export.py llm_cloud_eval.py tests

      - name: Tests
        run: pytest
